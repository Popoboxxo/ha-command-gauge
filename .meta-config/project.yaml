agent-meta-version: "1.2.0-beta.2"
ai-providers:
- Claude
- Opencode
platforms:
- hacs
dod-preset: standard
dod:
  tests-required: true
max-parallel-agents: 2
speech-mode: full
hooks:
  dod-push-check:
    enabled: false
pipeline-details-dir: .claude/pipeline-details
context_file:
  allow-external-artifacts:
    - .claude/agent-meta-state.json
    - .claude/platform-config.yaml
    - .opencode/agent-meta-state.json
external-tools:
  artifacts:
    - .claude/agent-meta-state.json
    - .claude/platform-config.yaml
    - .opencode/agent-meta-state.json
gitignore:
  generated: true
  exceptions:
    - ".claude/agents/"
    - ".claude/rules/"
    - ".claude/hooks/"
    - ".claude/commands/"
    - ".claude/skills/"
    - ".claude/pipeline-details/"
    - ".opencode/agents/"
    - ".opencode/commands/"
    - ".opencode/skills/"
    - ".opencode/pipeline-details/"
project:
  name: ha-command-gauge
  prefix: hcg
  short: command-gauge
provider-options:
  Claude: {}
  Opencode: {}
variables:
  PROJECT_NAME: ha-command-gauge
  PROJECT_DESCRIPTION: HACS Custom Integration für Home Assistant, die direkt gegen
    die CommandCode-API spricht und CommandCode-Nutzung, Credits, Limits und Abrechnung
    als Entities bereitstellt.
  PROJECT_GOAL: CommandCode-Nutzern ihre Konto-, Credit-, 5-Stunden- und Wochenfenster
    sowie Request-, Token- und Kostendaten direkt im Home-Assistant-Dashboard sichtbar
    machen.
  PLATFORM: Home Assistant Custom Integration (HACS)
  RUNTIME: Home Assistant Core (Python)
  LANGUAGE: Python 3
  PROJECT_LANGUAGES: Python
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  AGENT_META_REPO: Popoboxxo/agent-meta
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/ha-command-gauge
  GIT_MAIN_BRANCH: main
  SYSTEM_DEPENDENCIES: '- homeassistant: custom_components integration (domain `command_gauge`)\n-
    pytest: Unit-Tests mit HA-Stubs (siehe pytest.ini)\n'
  SYSTEM_URLS: '- CommandCode API: `https://api.commandcode.ai`'
  BUILD_COMMAND: (kein Build — reine Python-Integration)
  TEST_COMMAND: pytest
  DEV_COMMANDS: pytest\nruff check .\n
  DEV_STACK_START: (kein Dev-Stack — Tests gegen HA-Stubs und optionale QS-Instanz)
  DEV_STACK_RELOAD: ''
  PROJECT_CONTEXT: Eigenständige HACS-Integration (domain `command_gauge`), die pro
    Home-Assistant-Config-Entry ein CommandCode-Konto via API-Token anbindet. Direktes
    Cloud-Polling gegen api.commandcode.ai; keine externe Zusatzkomponente und kein
    lokaler CLI-Zwang.
  PROJECT_STRUCTURE: |
    custom_components/command_gauge/
      __init__.py       # Setup / Config-Entry-Registrierung
      config_flow.py    # API-Token-Konfiguration
      coordinator.py    # CommandCode-API-Client und DataUpdateCoordinator
      entity.py         # Basis-Entities und Option-Persistenz
      sensor.py         # Credit-, Fenster-, Summary- und Katalog-Sensoren
      binary_sensor.py  # Erreichbarkeit, Abo-Status und Limit-Warnungen
      number.py         # Live-Einstellungen
      switch.py         # Auto-Refresh-Schalter
      button.py         # Manueller Sofort-Refresh
      diagnostics.py    # Redigierter Diagnose-Export
      const.py          # Konstanten und defensives Parsing
      manifest.json
      strings.json
      translations/en.json
      translations/de.json
    tests/
  ENTRY_POINT_PATTERN: custom_components/command_gauge/__init__.py — Integration-Setup
  KEY_PATTERNS: |-
    - Ein DataUpdateCoordinator pro CommandCode-Konto
    - CommandCode-Alpha-Endpunkte defensiv als voneinander unabhängige Datenquellen behandeln
    - Pro Verbraucher mindestens ein verständlicher Teilzustand; niemals fehlende Daten als 0 ausgeben
    - Modelle als dynamisches JSON-Attribut statt als Entity pro Modell
  ARCHITECTURE: |
    custom_components/command_gauge/
      coordinator.py  # API-Client, Parser und Polling-Kern
      entity.py       # Basis für alle Plattformen
      sensor.py / binary_sensor.py / number.py / switch.py / button.py
  CODE_CONVENTIONS: |-
    - Python 3.12+, Home-Assistant-Integrationskonventionen (async, DataUpdateCoordinator)
    - snake_case für Module/Funktionen, PascalCase für Klassen
    - Type Hints und defensive Parser für alpha/undokumentierte API-Felder
    - Keine Secrets in Logs, State-Attributen, Exceptions oder Git
  CODE_QUALITY_RULES: |-
    - Keine ungenutzten Imports
    - Keine blocking Calls im HA-Event-Loop
    - Jede neue externe Anpassung braucht Unit-Tests
  EXTRA_DONTS: |-
    - Agent-meta-generierte Dateien nicht manuell bearbeiten.
    - Keine Secrets oder API-Tokens committen.
  PIPELINE_DETAILS_DIR: .claude/pipeline-details
  ROLE: (wird pro Agent gesetzt)
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  TEST_COMMANDS: pytest
  BUILD_COMMANDS: (kein Build)
  REQ_CATEGORIES: |-
    - Konto-, Credit-, Fenster- und Summary-Daten
    - Config Flow / Setup / Diagnostics
    - Polling, Fehlertoleranz und Sicherheit
  SERVICE_NAME: command_gauge
  CONTAINER_NAME: ha-command-gauge-dev
  PRIMARY_PORT: ''
  EXTRA_PORTS: ''
  DOCKER_STACKS_OVERVIEW: ''
  EXTRA_VOLUMES: ''
  EXTRA_VOLUME_DEFINITIONS: ''
  EXTRA_ENV_VARS: ''
  EXTRA_STARTUP_INFO: ''
  HOST_LAN_IP: ''
  PRIMARY_IMAGE_TAG: ''
  PLUGIN_DIR_NAME: command_gauge
  BUILD_OUTPUT: '- custom_components/command_gauge/ (direkt via HACS installiert)\n'
  ARTIFACT_ZIP_CMD: ''
  ARTIFACT_TAR_CMD: ''
  GH_ASSETS: ''
  REQUIRED_BINARIES_SECTION: Keine externen Binaries erforderlich.
  BINARY_INSTALL_STEPS: ''
  REQUIRED_BINARY_NAMES: (keine)
  BUILD_SYSTEM_NOTES: HACS installiert custom_components/command_gauge direkt.
  VERSION_DIST_BEHAVIOUR: Version wird manuell in manifest.json gepflegt und per GitHub-Release
    getaggt.
rules-preset: default
tier-preset: Normal
conventions-preset: default
se-focus: false
debug-mode: false
allow-committed-secrets: false
model-inherit-main-chat:
  Claude: true
  Opencode: true
# Repo-Containment ('Gefängnis-Modus'): confines agent WRITE access to the project root (plus the tmp-sink). Opt-out: enabled: false.
repo_containment:
  enabled: true
  tmp-sink:
    enabled: true
    path: .tmp
    gitignore: true
    cleanup: manual
