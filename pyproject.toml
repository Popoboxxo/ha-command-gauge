[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-command-gauge"
version = "1.1.0"
description = "Home Assistant integration for CommandCode usage, credits, and limits"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# tests/conftest.py installs its own HA stubs; the globally installed
# pytest-homeassistant-custom-component plugin (entry point "homeassistant")
# is not used here and crashes on import outside Linux (fcntl), so keep
# pytest from auto-loading it. No-op in CI where the plugin is absent.
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".agent-meta", "external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
