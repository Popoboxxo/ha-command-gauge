name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio voluptuous aiohttp ruff
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint
        run: |
          ruff check .
          ruff format --check custom_components tests
      - name: JSON meta-file and translation parity
        run: python scripts/check_json_consistency.py
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Home Assistant manifest validation
        uses: home-assistant/actions/hassfest@master

  release-version-sync:
    # The Release-Dreiklang rule: HACS takes the version from the release tag,
    # Home Assistant from manifest.json - they must match (v-prefix only in
    # the tag). Enforced on every published release; a manual dispatch against
    # a branch is skipped unless the ref looks like a version tag.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches manifest version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/check_version_sync.py

  canon-check:
    # Gauge Entity Canon check: verifies entities, translations, attributes,
    # icons/units and settings ranges against the canon schema from the
    # ha-gauge-standard submodule (single source of truth for the Gauge family).
    # Registered deviations (⚠️) keep the run green; anything else fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check entities against the Gauge canon
        run: python external/ha-gauge-standard/scripts/check_canon.py .
